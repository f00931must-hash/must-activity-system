<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MUST Activity System</title><link rel="stylesheet" href="../shared/css/theme.css"><link rel="stylesheet" href="./css/frontend.css?v=4.6.1"></head><body><header class="hero"><div><div class="eyebrow">MUST ACTIVITY SYSTEM</div><h1>資源教室活動報名平台</h1><p>活動報名、回饋填寫與資訊查詢都在這裡。</p></div><a class="admin-link" href="../admin/">管理後台</a></header><main class="wrap"><section class="student-lookup-panel">
